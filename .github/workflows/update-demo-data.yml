name: 更新演示数据

on:
  push:
    branches: [main]
    paths:
      - "文件/**/*.xlsx"
      - "文件/*.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate demo data from Excel
        run: python scripts/gen_real_demo_data.py

      - name: Commit and push demo assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/versions/v1.0.0/assets/real-work-stat-demo.json
          git add prototype/versions/v1.0.0/assets/real-work-stat-demo.js
          if git diff --staged --quiet; then
            echo "演示数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 从 Excel 自动更新演示数据"
          git push
