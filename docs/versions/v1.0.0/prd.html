## 一、结论摘要

本版在录入闭环与智能问数基础上，补齐 **作业条件结构化**、将原速览升级为 **以司机为核心的作业效率分析 + 作业总量总览**，货种统一为 **一级大类→二级货种级联**，并纳入 **企微 H5 填报发起**（审核规则文档化，原型不画审批页）。

| 能力 | 结论 | 优先级 |
|---|---|---|
| 是否正常作业 | 时段×机械位必填；「否」必选原因（字典「异常原因」）+ 非正常时段；备注始终可填，「其他」时备注必填；作业量仍可编辑 | P0 |
| 非正常与效率 | 非正常不强制清零作业量；**司机效率 Tab** 不做异常原因统计与异常维汇总卡；**总量 Tab** 按产量展示正常/异常与异常类型占比 | P0 |
| 货种级联 | 全局筛选/录入：一级一个下拉 + 二级一个下拉（如 吨包袋 → 磷肥）；字典维护二级树 | P0 |
| 作业效率分析 | 三 Tab：**司机效率**（默认）/ **作业总量统计** / **日班明细**；司机榜按**二级货种**对比吨/小时 | P0 |
| 作业总量统计 | 领导总览：KPI → **总量日趋势** → **货种排行（整行）** → **白夜/正常异常/异常类型三列占比** → 日班简表 | P0 |
| 日班明细 | 按开班日+班次浏览已通过单据 | P1 |
| 智能问数 | 保留；可问司机/货种/班次效率类问题（P1 扩展） | P0/P1 |
| 企微 H5 | 单条明细录入、日班单据汇总、提交发起；货种级联录入 | P0 |
| 审批/消息/权限配置 | 平台承接；本模块原型不画审批中心/消息/权限页 | — |

### 已锁定业务约定

| 约定项 | 结论 |
|---|---|
| 版本策略 | 唯一 v1.0.0 内迭代 |
| 作业量单位 | 吨，保留 2 位小数 |
| 单机效率看板 | 不做；本期做 **司机效率**（非机械台时效率看板） |
| 称谓 | 分析/填报界面统一称「司机」（对应司机字典） |
| 泊位–机械 | 固定绑定，每泊位 1～2 台机械 |
| 录入组织方式 | 一人填报全部泊位 |
| 录入粒度 | PC：按「开班日 + 班次」矩阵填满 12 时段；企微：同一单据下逐条明细录入，整单提交 |
| 货种字段 | 全部机械位具备货种；存二级货种，展示可带一级路径（一级 / 二级） |
| 货种级联默认（筛选） | 允许「全部」时：一级默认「全部」、二级仅「全部」（一级=全部时二级不可跨一级枚举） |
| 货种级联默认（司机效率） | 一级+二级必选，默认如「散货 → 氧化钙」，禁止跨二级混排效率总分 |
| 夜班日期 | 归属开班日 |
| 司机归并 | 按司机字典姓名汇总；一人多机明细带机械 |
| 原因字典 | 展示名「异常原因」；枚举：停电/无生产作业、吃饭休息、车辆断档、交接班、避高温暂停、下雨暂停、完船、**设备异常**、**其他** |
| 填报后 | 提交后走平台审批；通过后锁定；分析仅消费已通过 |
| 助手默认窗口 | 近 1 个月；超窗询问；本期不导出 |
| 单位时间 | 1 个填报时段格子 = 1 小时 |

## 二、产品概述

### 2.1 产品定位

港口现场 **单机分时段作业量记录、司机作业效率与作业总量分析、智能问数** 工具；PC 承担分析与配置，企微承担现场轻量填报与发起。

### 2.2 产品目标

| 目标 | 说明 | 优先级 |
|---|---|---|
| 结构化日班录入 | 含是否正常作业 + 原因 + 可编辑作业量；货种二级级联 | P0 |
| 自动汇总 / 填后锁定 | 提交审批通过后锁定 | P0 |
| 作业效率分析 | 按司机、二级货种、白/夜班的单位时间作业量考核 | P0 |
| 作业总量统计 | 按开班日范围总览产量结构（货种/班次/正常异常/异常类型）与日趋势 | P0 |
| 企微轻量填报发起 | 现场逐条录入明细，日班单据汇总后提交发起 | P0 |
| 智能对话问数 | 自然语言查询已通过数据 | P0 |
| 快捷问数 | 预置日常汇总与效率类快捷 | P1 |
| 字典 / 导出填报 | 司机/货种（二级树）/异常原因字典；列表导出 | P1 |

### 2.3 用户角色定义

| 角色 | 职责 | 终端侧重 |
|---|---|---|
| 作业录入员 | 填报、保存、提交发起 | PC + 企微 |
| 数据查看人 | 效率分析、问数、只读写填报 | PC 为主 |
| 基础配置员 | 泊位机械、字典 | 仅 PC |
| 审批人 | 平台审批通过/驳回 | 平台能力；文档描述，原型不画审批页 |

## 三、范围说明

### 3.1 包含（本版）

| 范围 | 优先级 | 说明 |
|---|---|---|
| 日班矩阵录入/汇总/列表/字典/导出 | P0/P1 | 继承并增强正常作业字段；货种二级树；原因展示名「异常原因」 |
| 作业效率分析（原已通过数据速览升级） | P0 | 司机效率 + 作业总量统计 |
| 日班明细 Tab | P1 | 效率分析页内保留原速览浏览能力 |
| 智能问数 + 快捷问数 | P0/P1 | 保留 |
| 企微 H5：列表 / 日班单据 / 单条录入 / 提交发起 | P0 | 本版纳入；PC 仍矩阵 |
| 审批状态流转说明 | P0 | 仅文档；原型不画审批操作页 |

### 3.2 不包含（本期）

| 不包含项 | 说明 |
|---|---|
| 助手结果导出 | 本期只出结果 |
| 单机台时效率看板 | 不做 |
| 消息中心、权限配置页、审批操作原型页 | 平台统一；审核规则见文档 |
| 独立原生 App | 仅企微内嵌 H5 |

### 3.3 关于原「第 8 点」产品拍板说明

原方案曾问：效率分析是否保留「日班速览」能力。  
**拍板：** 菜单统一为「作业效率分析」；页内提供三个 Tab——**司机效率（默认）** / **作业总量统计** / **日班明细（次级）**，避免丢失按日班浏览已通过数据的能力，并满足领导对总量结构的总览诉求。

## 四、业务流程

### 4.1 完整业务流程图

```mermaid
flowchart TD
    A[统一登录] --> B{终端}
    B -->|PC/企微| C[日班填报含是否正常作业]
    C --> D[提交发起平台审批]
    D -->|通过| E[单据已通过锁定]
    D -->|驳回| C
    E --> F[作业效率分析-司机效率]
    E --> G[作业总量统计Tab]
    E --> I[日班明细Tab]
    E --> H[智能问数]
    B -->|PC| F
    B -->|PC| H
```

**文字解读：** 填报（含条件标记）→ 平台审批 → 已通过数据进入效率分析（司机效率 / 作业总量 / 日班明细）与问数；企微侧重填报发起，分析在 PC。

### 4.2 子流程：正常/非正常填报

```mermaid
flowchart TD
    A[选择时段×机械位] --> B{是否正常作业}
    B -->|是| C[可填货种与作业量·备注选填]
    B -->|否| D[必选非正常原因]
    D --> D1[必填非正常时段·须落在本行时段内]
    D1 --> D2{原因是否其他}
    D2 -->|是| D3[备注必填]
    D2 -->|否| E[备注选填]
    D3 --> E
    E --> F[作业量仍可编辑]
    F --> G[参与汇总与效率/总量统计]
    C --> G
```

**文字解读：** 非正常不等于停工清零；须选原因并填写落在对应作业时段内的非正常起止时间；选「其他」须写备注。产量可保留，司机效率按正常维考核，总量 Tab 可看正常/异常与异常类型结构。

### 4.3 用户交互流程图

```mermaid
flowchart TD
    L[填报列表PC/企微] --> E[填报编辑]
    L --> V[填报只读]
    F[作业效率分析] --> T1[司机效率Tab]
    F --> T2[作业总量统计Tab]
    F --> T3[日班明细Tab]
    T1 --> V
    T2 --> V
    T3 --> V
    F --> A[智能问数]
    L --> A
    FAB[全局问数悬浮] --> A
    M[泊位机械配置PC]
    D[字典管理PC]
```

### 4.4 填报单状态机

```mermaid
stateDiagram-v2
    [*] --> 草稿: 新建并保存
    草稿 --> 草稿: 再次保存
    草稿 --> 审批中: 提交发起
    审批中 --> 已通过: 平台审批通过
    审批中 --> 已驳回: 平台审批驳回
    已驳回 --> 草稿: 修改后保存
    已驳回 --> 审批中: 再次提交
    已通过 --> [*]
```

**说明：** 效率分析与问数仅消费「已通过」。审批操作由平台承接，本版原型不交付审批页。

### 4.5 企微端数据流转（文档约定）

```mermaid
sequenceDiagram
    participant U as 录入员
    participant WX as 企微H5
    participant P as 平台流程
    participant PC as PC效率分析

    U->>WX: 逐条添加作业明细
    WX->>WX: 日班单据汇总已录明细
    U->>WX: 整单提交审核
    WX->>P: 发起审批
    Note over P: 审核在平台完成(原型不画)
    P-->>WX: 状态回写审批中/已通过/已驳回
    P-->>PC: 已通过数据可分析
```

**文字解读：** 企微按「一条明细」录入并挂在开班日+班次单据下，录完后整单提交；PC 仍可矩阵录入，字段口径一致。

## 五、功能模块总览

### 5.1 作业填报（增强）

| 维度 | 说明 |
|---|---|
| 功能介绍 | 按开班日+班次录入各机械时段作业；标记是否正常作业及原因 |
| 前置条件 | 统一登录；泊位机械、司机/货种/原因字典已配置 |
| 数据权限 | 录入员编辑草稿/已驳回；他人按角色只读 |
| 页面跳转 | 列表→编辑/只读；提交后回列表看状态 |

矩阵单元格（PC）/ 单条明细（企微）字段：

| 字段 | 规则 | 优先级 |
|---|---|---|

## 七、用户交互路径

### 7.1 正常流程：PC 填报含条件标记

1. 打开填报编辑 → 各时段默认「正常作业」；备注始终可填。  
2. 遇大风仍作业：选「否」→ 选原因 → 填非正常时段（须在本行时段内）→ 若选「其他」须填备注 → 仍填写实际作业量。  
3. 提交发起 → 平台审批通过 → 进入效率分析。

### 7.2 正常流程：司机效率分析

1. 侧栏进入「作业效率分析」。  
2. 默认 Tab「司机效率」，**货种级联默认一个二级货种（如散货→氧化钙）**，可切换班次/司机。  
3. 查看本货种总览卡片、「每日作业量趋势」、司机效率榜（同货种内排序）。  
4. 切换一级/二级货种后，卡片/折线/榜单一并刷新。  
5. 点击司机下钻明细 → 只读写填报单。

### 7.2.1 正常流程：作业总量统计

1. 切换至 Tab「作业总量统计」。  
2. 顶栏仅调开班日范围查询；先看 KPI 与「总量日趋势」（可切换货种级联）。  
3. 下看「货种作业量排行榜」（整行堆积柱），再看同一排三列：白夜占比、正常/异常占比、异常类型占比（均按产量吨）。  
4. 在「日班产量明细」旁独立筛选货种，查看按日聚合的白夜结构简表。

### 7.3 正常流程：企微填报发起

1. 企微入口进入填报列表 → 新建/打开日班单据（开班日+班次）。  
2. 点击「添加一条」填写时段、泊位/机械、司机、货种一级/二级、作业量、是否正常（及原因、非正常时段、备注）→ 保存回单据。  
3. 可继续添加多条；可编辑单头、删除整单；录完后点击「提交审核」。  
4. 列表查看审批中/已通过/已驳回状态（审核动作在平台，本原型不画）。

### 7.4 边界情况

| 边界 | 行为 |
|---|---|
| 非正常但作业量为 0 | 允许；总量统计计入非正常产量；司机效率仍以正常维为主 |
| 非正常且作业量 > 0 | 允许入库；总量 Tab 按产量计入正常/异常与异常类型占比 |
| 正常但作业量为 0 | 允许；不强制填原因/时段 |
| 非正常时段刚好等于行时段起止 | 允许 |
| 一人多机 | 榜单按司机汇总；明细分行显示机械 |
| 企微单据无明细即提交 | 拦截：至少一条明细 |
| 无已通过数据 | 效率分析空状态 |
| 总量页一级=全部 | 二级仅「全部」；趋势展示全部二级货种折线 |
| 总量趋势与简表货种筛选 | 互不影响，各自独立级联 |

### 7.5 异常兜底

| 异常 | 行为 |
|---|---|
| 「否」未选原因 / 未填非正常时段提交 | 拦截提示 |
| 非正常时段越界或结束不晚于开始 | 拦截提示 |
| 选「其他」未填备注 | 拦截提示 |
| 提交/加载失败 | 明确文案 + 可重试；草稿保留 |
| 问数超 1 个月 | 先询问再查 |
| 问数失败 | 可重试 + 推荐快捷 |

## 十一、场景说明

### 11.1 正常流程

- 录入员在企微或 PC 完成日班填报（含大风天非正常+时段+备注+实际产量，货种级联）并提交；通过后，查看人在「作业效率分析」**选定二级货种**后查看司机吨/小时榜与每日作业量趋势，或在「作业总量统计」按顺序查看日趋势、货种排行与三列产量占比。

### 11.2 边界情况

- 仅白班有某货种：夜班切片对该货种显示空/无数据；总量排行夜班段为 0 或无堆积。  
- 切换二级货种后榜单排序与产量口径随之变化，不与上一货种混比。  
- 日班明细 Tab 无数据：提示暂无已通过单据。  
- 总量页货种一级=全部：二级锁定「全部」。  
- 趋势图与简表各自筛选，改一处不影响另一处。

### 11.3 异常兜底

- 字典原因缺失：仅允许选启用枚举（含「其他」）；选「其他」须填备注说明。  
- 非正常时段越界：拦截并提示须落在对应作业时段内。  
- 服务异常：保存失败提示，不丢已输入草稿。  
- 录入未选齐货种一级/二级：拦截提交/保存。

## 十四、待确认

1. 问数时间跨度硬上限（建议最长 12 个月）是否采纳。  
2. 「今日」是否严格=开班日今日（含今日夜班）——当前按开班日口径。

6. 作业总量「环比」对比基期（环比上期同天数 / 上月同期）是否统一口径。  
7. 货种一级「全部」时，排行榜/三列占比是否始终展示全范围（与简表筛选解耦）——当前原型为全范围结构图 + 简表/趋势可筛。

  <script>
    mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "loose" });

    function slugify(text) {
      return String(text)
        .trim()
        .toLowerCase()
        .replace(/[^\w\u4e00-\u9fff\- ]+/g, "")
        .replace(/\s+/g, "-");
    }

    function buildToc(root) {
      const box = document.getElementById("toc-links");
      box.innerHTML = "";
      root.querySelectorAll("h2, h3").forEach((h) => {
        if (!h.id) h.id = slugify(h.textContent);
        const a = document.createElement("a");
        a.href = "#" + h.id;
        a.textContent = h.textContent;
        if (h.tagName === "H3") a.className = "l2";
        box.appendChild(a);
      });
    }

    async function render() {
      const loading = document.getElementById("loading");
      const content = document.getElementById("content");
      const error = document.getElementById("error");
      try {
        let md = document.getElementById("prd-embedded").textContent.trim();
        md = md.replace(/\n## 目录\n[\s\S]*?\n---\n/, "\n---\n");
        const renderer = new marked.Renderer();
        const originCode = renderer.code.bind(renderer);
        renderer.code = function (code, infostring, escaped) {
          const lang = (infostring || "").trim();
          if (lang === "mermaid") {
            return '<div class="mermaid">' + code.replace(/</g, "&lt;") + "</div>";
          }
          return originCode(code, infostring, escaped);
        };
        marked.setOptions({ renderer, gfm: true, breaks: false });
        content.innerHTML = marked.parse(md);
        content.querySelectorAll(".mermaid").forEach((el) => { el.innerHTML = el.textContent; });
        await mermaid.run({ nodes: content.querySelectorAll(".mermaid") });
        buildToc(content);
        loading.classList.add("hidden");
        content.classList.remove("hidden");
      } catch (e) {
        loading.classList.add("hidden");
        error.classList.remove("hidden");
        error.textContent = "PRD 渲染失败：" + (e && e.message ? e.message : e);
      }
    }
    render();
  </script>
