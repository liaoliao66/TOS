    .btn { border-radius: 20px; -webkit-transition: all .15s ease; transition: all .15s ease; }
    .btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
    .btn-brand { background: var(--brand); color: #fff; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

    .fade-in { -webkit-animation: fadeIn .2s ease; animation: fadeIn .2s ease; }
    @-webkit-keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    input, select { font-size: 14px; min-height: 36px; }

            <option>交接班</option>

  <script>
    function showToast(msg, type) {
      type = type || 'ok';
      var el = document.createElement('div');
      el.className = 'toast fade-in px-4 py-3 text-sm text-white text-center ' + (type === 'err' ? 'bg-red-500' : 'bg-emerald-500');
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 2200);
    }
    function toggleReason(sel) {
      var box = sel.parentElement;
      var reason = box.querySelector('.reason-sel');
      if (!reason) return;
      if (sel.value === 'no') { reason.classList.remove('hidden'); }
      else { reason.classList.add('hidden'); reason.selectedIndex = 0; }
    }
    function submitForm() {
      showToast('已提交发起，审批由平台处理');
      setTimeout(function(){ window.location.href = 'work-stat-list-wecom.html'; }, 1200);
    }
  </script>
