<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>本班填报 · 企微H5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="../assets/cargo-mgmt-demo.js"></script>
  <script src="../assets/cargo-cascade.js"></script>
  <script src="../assets/work-stat-sheet-store.js"></script>
  <style>
    :root { --brand: #0f766e; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; font-size: 14px; background: #f1f5f9; }
    .btn { border-radius: 20px; -webkit-transition: all .15s ease; transition: all .15s ease; }
    .btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
    .btn-brand { background: var(--brand); color: #fff; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .badge { border-radius: 999px; font-size: 12px; padding: 2px 10px; display: inline-block; }
    .badge-draft { background: #e2e8f0; color: #475569; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-sent { background: #ccfbf1; color: #0f766e; }
    .toast { position: absolute; top: 72px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 90; min-width: 220px; max-width: 90%; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .page-bg { background: #e2e8f0; min-height: 100vh; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; padding: 24px 12px; box-sizing: border-box; }
    .phone-frame { width: 390px; height: 844px; border-radius: 48px; border: 3px solid #e5e7eb; background: #0f172a; box-shadow: 0 12px 40px rgba(15,23,42,0.18); padding: 12px; box-sizing: border-box; }
    .phone-screen { width: 100%; height: 100%; border-radius: 36px; background: #f1f5f9; overflow: hidden; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; position: relative; }
    .phone-status { height: 28px; background: #fff; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 16px; font-size: 11px; color: #334155; border-bottom: 1px solid #f1f5f9; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .phone-scroll { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; min-height: 0; }
    .wecom-tag { font-size: 10px; color: #0f766e; background: #ccfbf1; border-radius: 999px; padding: 1px 8px; }
    .bottom-bar { -webkit-flex-shrink: 0; flex-shrink: 0; background: rgba(255,255,255,0.98); border-top: 1px solid #e2e8f0; padding: 10px 12px 16px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .mask { position: absolute; inset: 0; background: rgba(15,23,42,0.45); z-index: 60; display: none; -webkit-box-align: end; -webkit-align-items: flex-end; align-items: flex-end; }
    .mask.open { display: -webkit-box; display: -webkit-flex; display: flex; }
    .sheet { width: 100%; background: #fff; border-radius: 20px 20px 0 0; padding: 16px 16px 20px; max-height: 85%; overflow-y: auto; }
    .field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .field input, .field select { width: 100%; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px 12px; font-size: 14px; min-height: 40px; background: #fff; box-sizing: border-box; }
    .shift-opt { flex: 1; text-align: center; padding: 10px 0; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; color: #475569; font-size: 14px; }
    .shift-opt.active { border-color: #0f766e; background: #f0fdfa; color: #0f766e; font-weight: 600; }
    .op-link { color: #0f766e; font-size: 12px; background: none; border: none; padding: 0; margin-right: 10px; }
    .op-del { color: #dc2626; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }
    .slot-empty { border: 1px dashed #cbd5e1; background: #f8fafc; }
    .slot-sent { background: #f8fafc; border-color: #e2e8f0; }
    .slot-qty-wrap { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 8px; margin-top: 8px; }
    .slot-qty-input {
      -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
      border: 1px solid #99f6e4; border-radius: 12px; padding: 10px 12px;
      font-size: 16px; font-weight: 600; color: #0f766e; background: #fff; min-height: 44px; box-sizing: border-box;
    }
    .slot-qty-input:focus { outline: none; border-color: #0f766e; box-shadow: 0 0 0 2px rgba(15,118,110,0.15); }
    .slot-qty-readonly { font-size: 16px; font-weight: 600; color: #334155; }
    .slot-actions {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9;
      display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: end; -webkit-justify-content: flex-end; justify-content: flex-end; gap: 16px;
    }
    .slot-actions .op-link { font-size: 13px; padding: 4px 0; }
  </style>
</head>
<body class="page-bg text-slate-800">
  <div class="phone-frame" aria-label="手机预览框">
    <div class="phone-screen">
      <div class="phone-status">
        <span>9:41</span>
        <span class="wecom-tag">企微 H5</span>
        <span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span>
      </div>

      <div class="phone-scroll">
        <!-- 本班：机台表列表 -->
        <div id="viewShift" class="view-panel active">
          <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 h-12 flex items-center gap-3">
            <a href="work-stat-list-wecom.html" class="text-teal-700 text-sm shrink-0"><i class="fa-solid fa-chevron-left mr-1"></i>作业记录</a>
            <div class="font-semibold text-base flex-1 text-center">作业填报</div>
          </header>

          <main class="px-4 pt-3 pb-4 space-y-3">
            <div class="card p-4">
              <div class="grid grid-cols-2 gap-2 mb-3">
                <div class="field mb-0">
                  <label>开班日</label>
                  <input id="hdrDate" type="date" onchange="onContextChange()" />
                </div>
                <div class="field mb-0">
                  <label>班次</label>
                  <select id="hdrShift" onchange="onContextChange()">
                    <option value="白班">白班</option>
                    <option value="夜班">夜班</option>
                  </select>
                </div>
              </div>
              <div class="flex items-center justify-between text-sm">
                <span class="badge badge-draft" id="sheetStatus">草稿</span>
                <span class="text-slate-500">本班合计 <strong id="sheetTotal" class="text-teal-800">0.00</strong> 吨</span>
              </div>
              <p class="text-xs text-teal-800 bg-teal-50 rounded-xl px-3 py-2 mt-3">移动端以<strong>卡片逐条</strong>填时段，不用 PC 大表。点机台表进入 12 个时段卡片。</p>
            </div>

            <div class="flex items-center justify-between px-1">
              <div class="text-sm font-medium text-slate-700">本班机台表</div>
              <button type="button" id="btnAddUnit" class="text-teal-700 text-sm" onclick="openCreateUnit()"><i class="fa-solid fa-plus mr-1"></i>新增</button>
            </div>
            <div id="unitList" class="space-y-3"></div>
            <div id="unitEmpty" class="hidden card p-8 text-center text-slate-400 text-sm">暂无机台表<br/><span class="text-xs">请点「新增」创建</span></div>
          </main>
        </div>

        <!-- 机台表：时段卡片 -->
        <div id="viewUnit" class="view-panel">
          <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 h-12 flex items-center gap-3">
            <button type="button" class="text-teal-700 text-sm shrink-0" onclick="backToShift()"><i class="fa-solid fa-chevron-left mr-1"></i>本班</button>
            <div class="font-semibold text-base flex-1 text-center truncate" id="unitHdrTitle">作业填报</div>
          </header>

          <main class="px-4 pt-3 pb-4 space-y-3">
            <div class="card p-4">
              <div class="text-sm font-medium" id="unitMeta">—</div>
              <div class="text-xs text-slate-500 mt-1">泊位/机械不可改 · 合计 <span id="unitTotal" class="text-teal-800 font-medium">0.00</span> 吨</div>
              <div class="mt-3 flex gap-3 text-xs" id="unitOps"></div>
            </div>
            <div class="px-1 text-sm font-medium text-slate-700">时段明细（卡片）</div>
            <p class="px-1 text-xs text-slate-400 mb-1">未发送可直接改作业量；编辑/发送在卡片底部。发送后与 PC 共用数据，显示已推送并锁定。</p>
            <div id="slotList" class="space-y-2"></div>
          </main>
        </div>
      </div>

      <div class="bottom-bar" id="bottomBar">
        <button type="button" id="btnSubmit" class="btn btn-brand w-full py-3 text-sm" onclick="submitShift()">提交本班审批</button>
      </div>

      <!-- 新增机台表 -->
      <div id="createMask" class="mask" onclick="closeIfMask(event,'createMask')">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold text-base">新增机台表</div>
            <button type="button" class="text-slate-400" onclick="closeCreateUnit()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div class="field"><label>泊位</label><select id="fBerth" onchange="syncMachine()"></select></div>
              <div class="field"><label>机械</label><select id="fMachine"></select></div>
            </div>
            <div class="field"><label>司机</label><select id="fDriver"></select></div>
            <div class="grid grid-cols-2 gap-2">
              <div class="field"><label>货种一级</label><select id="fCargoL1"></select></div>
              <div class="field"><label>货种二级</label><select id="fCargoL2"></select></div>
            </div>
            <button type="button" class="btn btn-brand w-full py-3 text-sm" onclick="createUnit()">生成 12 时段卡片</button>
          </div>
        </div>
      </div>

      <!-- 编辑机台表 -->
      <div id="editUnitMask" class="mask" onclick="closeIfMask(event,'editUnitMask')">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold text-base">编辑机台表</div>
            <button type="button" class="text-slate-400" onclick="closeEditUnit()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <div class="field"><label>泊位（不可改）</label><input id="euBerth" disabled class="bg-slate-50 text-slate-500" /></div>
              <div class="field"><label>机械（不可改）</label><input id="euMachine" disabled class="bg-slate-50 text-slate-500" /></div>
            </div>
            <div class="field"><label>司机</label><select id="euDriver"></select></div>
            <div class="grid grid-cols-2 gap-2">
              <div class="field"><label>货种一级</label><select id="euCargoL1"></select></div>
              <div class="field"><label>货种二级</label><select id="euCargoL2"></select></div>
            </div>
            <button type="button" class="btn btn-brand w-full py-3 text-sm" onclick="saveUnitEdit()">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var S = WorkStatSheetStore;
    var activeUnitId = '';
    var readonly = false;
    var cargoCtl = null;
    var unitEditCargoCtl = null;

    function showToast(msg, type) {
      type = type || 'ok';
      var host = document.querySelector('.phone-screen');
      var el = document.createElement('div');
      el.className = 'toast px-4 py-3 text-sm text-white text-center ' + (type === 'err' ? 'bg-red-500' : 'bg-emerald-500');
      el.textContent = msg;
      host.appendChild(el);
      setTimeout(function () { el.remove(); }, 2400);
    }

    function statusClass(st) {
      if (st === '审批中') return 'badge-pending';
      if (st === '已驳回') return 'badge-reject';
      if (st === '已通过') return 'badge-ok';
      return 'badge-draft';
    }

    function getDate() { return document.getElementById('hdrDate').value; }
    function getShift() { return document.getElementById('hdrShift').value; }

    function syncMachine() {
      var berth = document.getElementById('fBerth').value;
      var list = S.BERTH_MACHINES[berth] || [];
      document.getElementById('fMachine').innerHTML = list.map(function (m) {
        return '<option value="' + m + '">' + m + '</option>';
      }).join('') || '<option value="">无</option>';
    }

    function initFields() {
      document.getElementById('fBerth').innerHTML = Object.keys(S.BERTH_MACHINES).map(function (b) {
        return '<option value="' + b + '">' + b + '</option>';
      }).join('');
      syncMachine();
      var driverHtml = S.DRIVERS.map(function (d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');
      document.getElementById('fDriver').innerHTML = driverHtml;
      document.getElementById('euDriver').innerHTML = driverHtml;
      cargoCtl = CargoCascade.bindPair(document.getElementById('fCargoL1'), document.getElementById('fCargoL2'), { entryMode: true, defaultL1: '散货', defaultL2: '氧化钙' });
      unitEditCargoCtl = CargoCascade.bindPair(document.getElementById('euCargoL1'), document.getElementById('euCargoL2'), { entryMode: true });
    }

    function bootContext() {
      var range = S.dateRange();
      var dateEl = document.getElementById('hdrDate');
      dateEl.min = range.from;
      dateEl.max = range.to;
      var params = new URLSearchParams(window.location.search || '');
      var a = S.getActive();
      if (params.get('date')) {
        dateEl.value = params.get('date');
        document.getElementById('hdrShift').value = params.get('shift') || '白班';
      } else if (a && a.date) {
        dateEl.value = a.date;
        document.getElementById('hdrShift').value = a.shift || '白班';
        activeUnitId = a.unitId || '';
      } else {
        dateEl.value = S.todayStr();
        document.getElementById('hdrShift').value = '白班';
      }
      S.ensureSheet(getDate(), getShift());
      if (params.get('unitId')) activeUnitId = params.get('unitId');
    }

    function onContextChange() {
      activeUnitId = '';
      S.setActive({ date: getDate(), shift: getShift(), unitId: '' });
      S.ensureSheet(getDate(), getShift());
      backToShift();
      renderShift();
    }

    function openCreateUnit() {
      if (readonly) { showToast('当前班次不可新增', 'err'); return; }
      document.getElementById('createMask').classList.add('open');
    }
    function closeCreateUnit() { document.getElementById('createMask').classList.remove('open'); }

    function createUnit() {
      var cargo = cargoCtl.getValue();
      if (!cargo.l1 || !cargo.l2) { showToast('请选择货种', 'err'); return; }
      var res = S.createUnit({
        date: getDate(), shift: getShift(),
        berth: document.getElementById('fBerth').value,
        machine: document.getElementById('fMachine').value,
        driver: document.getElementById('fDriver').value,
        cargoL1: cargo.l1, cargoL2: cargo.l2
      });
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      closeCreateUnit();
      activeUnitId = res.unit.id;
      showToast('已生成机台表');
      openUnit(activeUnitId);
    }

    function openUnit(unitId) {
      activeUnitId = unitId;
      S.setActive({ date: getDate(), shift: getShift(), unitId: unitId });
      document.getElementById('viewShift').classList.remove('active');
      document.getElementById('viewUnit').classList.add('active');
      document.getElementById('bottomBar').classList.add('hidden');
      renderUnit();
    }

    function backToShift() {
      document.getElementById('viewUnit').classList.remove('active');
      document.getElementById('viewShift').classList.add('active');
      document.getElementById('bottomBar').classList.remove('hidden');
      renderShift();
    }

    function openEditUnit() {
      if (readonly) { showToast('当前班次不可编辑', 'err'); return; }
      var unit = S.findUnit(S.getSheet(getDate(), getShift()), activeUnitId);
      if (!unit) return;
      document.getElementById('euBerth').value = unit.berth;
      document.getElementById('euMachine').value = unit.machine;
      document.getElementById('euDriver').value = unit.driver;
      unitEditCargoCtl.setValue(unit.cargoL1, unit.cargoL2);
      document.getElementById('editUnitMask').classList.add('open');
    }
    function closeEditUnit() { document.getElementById('editUnitMask').classList.remove('open'); }

    function saveUnitEdit() {
      var cargo = unitEditCargoCtl.getValue();
      if (!cargo.l1 || !cargo.l2) { showToast('请选择货种', 'err'); return; }
      var res = S.updateUnit(getDate(), getShift(), activeUnitId, {
        driver: document.getElementById('euDriver').value,
        cargoL1: cargo.l1, cargoL2: cargo.l2
      });
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      closeEditUnit();
      showToast('机台表已更新');
      renderUnit();
      renderShiftHeader();
    }

    function deleteUnitConfirm() {
      if (readonly) { showToast('当前班次不可删除', 'err'); return; }
      var unit = S.findUnit(S.getSheet(getDate(), getShift()), activeUnitId);
      if (!unit) return;
      if (S.unitHasSentRows(unit)) { showToast('含已推送行，不可删除', 'err'); return; }
      if (!confirm('确认删除该机台表？\n' + unit.berth + ' · ' + unit.machine)) return;
      var res = S.deleteUnit(getDate(), getShift(), activeUnitId);
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      activeUnitId = '';
      showToast('已删除');
      backToShift();
    }

    function getRowByIdx(idx) {
      var unit = S.findUnit(S.getSheet(getDate(), getShift()), activeUnitId);
      return unit && unit.rows ? unit.rows[idx] : null;
    }

    function readQtyFromInput(idx) {
      var el = document.getElementById('slotQty_' + idx);
      if (!el) return null;
      return Number(el.value) || 0;
    }

    function saveQtyInline(idx, silent) {
      if (readonly) return false;
      var row = getRowByIdx(idx);
      if (!row || row.wecomSent) return false;
      var qty = readQtyFromInput(idx);
      if (qty < 0) {
        if (!silent) showToast('作业量不能为负', 'err');
        return false;
      }
      var res = S.updateRow(getDate(), getShift(), activeUnitId, row.slot, { qty: qty });
      if (!res.ok) {
        if (!silent) showToast(res.msg, 'err');
        return false;
      }
      document.getElementById('unitTotal').textContent = S.unitTotal(S.findUnit(S.getSheet(getDate(), getShift()), activeUnitId)).toFixed(2);
      renderShiftHeader();
      if (!silent) showToast('作业量已保存');
      return true;
    }

    function sendSlotByIdx(idx) {
      if (readonly) return;
      var row = getRowByIdx(idx);
      if (!row || row.wecomSent) {
        showToast('该行已推送企微', 'warn');
        return;
      }
      if (!saveQtyInline(idx, true)) return;
      if (!confirm('推送「' + row.slot + '」到企微？\n推送后不可再编辑，PC 端同步显示已推送。')) return;
      var res = S.sendRowWecom(getDate(), getShift(), activeUnitId, row.slot);
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      showToast(res.msg || '已推送企微并锁定');
      renderUnit();
      renderShiftHeader();
    }

    function goLineByIdx(idx) {
      var row = getRowByIdx(idx);
      if (!row) return;
      if (row.wecomSent) {
        showToast('已推送企微，不可编辑', 'err');
        return;
      }
      saveQtyInline(idx, true);
      goLine(row.slot);
    }

    function sendSlot(slot) {
      var unit = S.findUnit(S.getSheet(getDate(), getShift()), activeUnitId);
      if (!unit) return;
      for (var i = 0; i < (unit.rows || []).length; i++) {
        if (unit.rows[i].slot === slot) { sendSlotByIdx(i); return; }
      }
    }

    function goLine(slot) {
      window.location.href = 'work-stat-line-wecom.html?date=' + encodeURIComponent(getDate()) +
        '&shift=' + encodeURIComponent(getShift()) + '&unitId=' + encodeURIComponent(activeUnitId) +
        '&slot=' + encodeURIComponent(slot);
    }

    function submitShift() {
      if (readonly) { showToast('当前状态不可提交', 'err'); return; }
      var sheet = S.getSheet(getDate(), getShift());
      if (!sheet || !sheet.units.length) { showToast('请先新增机台表', 'err'); return; }
      if (!confirm('提交本班审批？\n' + getDate() + ' · ' + getShift())) return;
      var res = S.submitSheet(getDate(), getShift());
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      showToast('已提交本班审批');
      setTimeout(function () { window.location.href = 'work-stat-list-wecom.html'; }, 800);
    }

    function renderShiftHeader() {
      var sheet = S.getSheet(getDate(), getShift()) || S.ensureSheet(getDate(), getShift());
      var st = sheet.status || '草稿';
      var stEl = document.getElementById('sheetStatus');
      stEl.textContent = st;
      stEl.className = 'badge ' + statusClass(st);
      document.getElementById('sheetTotal').textContent = S.sheetTotal(sheet).toFixed(2);
      readonly = st === '审批中' || st === '已通过';
      document.getElementById('btnSubmit').classList.toggle('hidden', readonly);
      document.getElementById('btnAddUnit').classList.toggle('hidden', readonly);
    }

    function renderShift() {
      renderShiftHeader();
      var sheet = S.getSheet(getDate(), getShift()) || S.ensureSheet(getDate(), getShift());
      var box = document.getElementById('unitList');
      var empty = document.getElementById('unitEmpty');
      if (!sheet.units.length) {
        box.innerHTML = '';
        empty.classList.remove('hidden');
        if (!readonly) openCreateUnit();
        return;
      }
      empty.classList.add('hidden');
      box.innerHTML = sheet.units.map(function (u) {
        var sentCount = (u.rows || []).filter(function (r) { return r.wecomSent; }).length;
        return '<button type="button" class="card p-4 w-full text-left active:bg-slate-50" onclick="openUnit(\'' + u.id + '\')">' +
          '<div class="font-medium text-sm">' + u.berth + ' · ' + u.machine + '</div>' +
          '<div class="mt-2 flex items-center justify-between text-xs">' +
            '<span class="text-teal-700">合计 ' + S.unitTotal(u).toFixed(2) + ' 吨</span>' +
            (sentCount ? '<span class="badge badge-sent">已推 ' + sentCount + ' 条</span>' : '<span class="text-slate-400">进入填时段</span>') +
          '</div></button>';
      }).join('');
    }

    function renderUnit() {
      var sheet = S.getSheet(getDate(), getShift());
      var unit = S.findUnit(sheet, activeUnitId);
      if (!unit) { backToShift(); return; }
      document.getElementById('unitHdrTitle').textContent = '作业填报';
      document.getElementById('unitMeta').textContent = unit.berth + ' · ' + unit.machine + ' · ' + unit.driver + ' · ' + unit.cargoL2;
      document.getElementById('unitTotal').textContent = S.unitTotal(unit).toFixed(2);
      var ops = document.getElementById('unitOps');
      if (readonly) {
        ops.innerHTML = '<span class="text-slate-400">本班已提交，仅可查看</span>';
      } else {
        ops.innerHTML =
          '<button type="button" class="op-link" onclick="openEditUnit()">编辑机台表</button>' +
          '<button type="button" class="op-link op-del" onclick="deleteUnitConfirm()"' +
          (S.unitHasSentRows(unit) ? ' disabled style="opacity:.4"' : '') + '>删除</button>';
      }
      document.getElementById('slotList').innerHTML = (unit.rows || []).map(function (r, idx) {
        var filled = (Number(r.qty) || 0) > 0 || r.normal === false || r.remark;
        var sent = !!r.wecomSent;
        var cardCls = 'card p-3 ';
        if (sent) cardCls += 'slot-sent';
        else if (!filled) cardCls += 'slot-empty';
        var driver = r.driver || unit.driver;
        var cargo = r.cargoL2 || unit.cargoL2;
        var statusBadge = r.normal === false
          ? '<span class="badge shrink-0" style="background:#fef3c7;color:#b45309">非正常</span>'
          : '<span class="badge shrink-0" style="background:#d1fae5;color:#047857">正常</span>';
        var qtyBlock = '';
        if (sent || readonly) {
          qtyBlock = '<div class="slot-qty-wrap">' +
            '<span class="slot-qty-readonly tabular-nums">' + (Number(r.qty) || 0).toFixed(2) + '</span>' +
            '<span class="text-xs text-slate-400">吨</span></div>';
        } else {
          qtyBlock = '<div class="slot-qty-wrap">' +
            '<input id="slotQty_' + idx + '" class="slot-qty-input tabular-nums" type="number" step="0.01" min="0" ' +
              'value="' + (Number(r.qty) || 0) + '" placeholder="填写作业量" ' +
              'onchange="saveQtyInline(' + idx + ', true)" onblur="saveQtyInline(' + idx + ', true)" />' +
            '<span class="text-xs text-slate-400 shrink-0">吨</span></div>';
        }
        var bottomBlock = '';
        if (sent) {
          bottomBlock = '<div class="slot-actions"><span class="badge badge-sent"><i class="fa-solid fa-check mr-1"></i>已推送 · 不可编辑</span></div>';
        } else if (!readonly) {
          bottomBlock = '<div class="slot-actions">' +
            '<button type="button" class="op-link" onclick="goLineByIdx(' + idx + ')">编辑</button>' +
            '<button type="button" class="op-link" onclick="sendSlotByIdx(' + idx + ')">发送</button>' +
            '</div>';
        }
        return '<div class="' + cardCls + '">' +
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="font-medium text-sm text-teal-800">' + r.slot + '</div>' +
            statusBadge +
          '</div>' +
          '<div class="mt-1 text-xs text-slate-500">' + driver + ' · ' + cargo + '</div>' +
          qtyBlock +
          (r.normal === false && r.abMins ? '<div class="mt-1 text-xs text-amber-700">非正常 ' + r.abMins + ' 分钟 · ' + (r.reason || '') + '</div>' : '') +
          bottomBlock +
        '</div>';
      }).join('');
    }

    function closeIfMask(e, id) {
      if (e.target === document.getElementById(id)) document.getElementById(id).classList.remove('open');
    }

    initFields();
    bootContext();
    if (activeUnitId) {
      openUnit(activeUnitId);
    } else {
      renderShift();
    }
  </script>
</body>
</html>
