<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>本班详情 · 企微H5 · v1.1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="../assets/work-stat-sheet-store.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; font-size: 14px; background: #f1f5f9; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .badge { border-radius: 999px; font-size: 12px; padding: 2px 10px; display: inline-block; }
    .badge-ok { background: #d1fae5; color: #047857; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-reject { background: #fee2e2; color: #b91c1c; }
    .badge-sent { background: #ccfbf1; color: #0f766e; }
    .page-bg { background: #e2e8f0; min-height: 100vh; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; padding: 24px 12px; box-sizing: border-box; }
    .phone-frame { width: 390px; height: 844px; border-radius: 48px; border: 3px solid #e5e7eb; background: #0f172a; box-shadow: 0 12px 40px rgba(15,23,42,0.18); padding: 12px; box-sizing: border-box; }
    .phone-screen { width: 100%; height: 100%; border-radius: 36px; background: #f1f5f9; overflow: hidden; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; position: relative; }
    .phone-status { height: 28px; background: #fff; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 16px; font-size: 11px; color: #334155; border-bottom: 1px solid #f1f5f9; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .phone-scroll { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
    .wecom-tag { font-size: 10px; color: #0f766e; background: #ccfbf1; border-radius: 999px; padding: 1px 8px; }
  </style>
</head>
<body class="page-bg text-slate-800">
  <div class="phone-frame" aria-label="手机预览框">
    <div class="phone-screen">
      <div class="phone-status">
        <span>9:41</span>
        <span class="wecom-tag">企微 H5 · v1.1.0</span>
        <span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span>
      </div>

      <div class="phone-scroll">
        <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 h-12 flex items-center gap-3">
          <a href="work-stat-list-wecom.html" class="text-teal-700 text-sm"><i class="fa-solid fa-chevron-left mr-1"></i>返回列表</a>
          <div class="font-semibold text-base flex-1 text-center pr-8">本班详情</div>
        </header>

        <main class="px-4 pt-3 space-y-3 pb-6" id="mainBody"></main>
      </div>
    </div>
  </div>

  <script>
    var S = WorkStatSheetStore;

    function statusClass(st) {
      if (st === '审批中') return 'badge-pending';
      if (st === '已驳回') return 'badge-reject';
      if (st === '已通过') return 'badge-ok';
      return 'badge-draft';
    }

    function boot() {
      var params = new URLSearchParams(window.location.search || '');
      var date = params.get('date');
      var shift = params.get('shift') || '白班';
      var sheet = date ? S.getSheet(date, shift) : null;
      var main = document.getElementById('mainBody');

      if (!sheet || !sheet.units.length) {
        main.innerHTML = '<div class="card p-8 text-center text-slate-400 text-sm">暂无数据</div>';
        return;
      }

      var st = sheet.status || '草稿';
      var html = '<div class="card p-4">' +
        '<div class="flex flex-wrap items-center gap-2 text-sm">' +
          '<span class="font-medium">' + date + ' · ' + shift + '</span>' +
          '<span class="badge ' + statusClass(st) + '">' + st + '</span>' +
        '</div>' +
        '<div class="mt-2 text-sm text-slate-500">机台表 ' + sheet.units.length + ' 张 · 合计 <span class="text-teal-800 font-semibold">' + S.sheetTotal(sheet).toFixed(2) + '</span> 吨</div>' +
        '<div class="mt-2 text-xs text-slate-400">只读 · 按时段卡片展示（与移动端填报一致，非大表）</div>' +
      '</div>';

      sheet.units.forEach(function (unit) {
        var uv = S.resolveVessel(unit, null);
        html += '<div class="px-1 pt-2 text-sm font-medium text-slate-600">' + unit.berth + ' · ' + unit.machine + ' · ' + unit.driver +
          ' · <span class="text-teal-800">' + (uv.name || '—') + '</span></div>';
        (unit.rows || []).forEach(function (r) {
          var filled = (Number(r.qty) || 0) > 0 || r.normal === false;
          if (!filled && !r.wecomSent) return;
          var driver = r.driver || unit.driver;
          var cargo = r.cargoL2 || unit.cargoL2;
          var rv = S.resolveVessel(unit, r);
          html += '<div class="card p-4">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div class="font-medium text-sm text-teal-800">' + r.slot + '</div>' +
              (r.wecomSent ? '<span class="badge badge-sent">已推送</span>' : '') +
            '</div>' +
            '<div class="mt-1 text-xs text-slate-500">' + driver + ' · ' + cargo + ' · ' + (rv.name || '—') +
            (S.rowHasVesselOverride(r) ? ' <span class="text-teal-700">(覆盖)</span>' : '') + '</div>' +
            '<div class="mt-2 flex items-center justify-between">' +
              '<div class="font-semibold">' + (Number(r.qty) || 0).toFixed(2) + ' <span class="text-xs font-normal text-slate-400">吨</span></div>' +
              (r.normal === false
                ? '<span class="badge" style="background:#fef3c7;color:#b45309">非正常</span>'
                : '<span class="badge badge-ok">正常</span>') +
            '</div>' +
            (r.normal === false && r.abMins ? '<div class="mt-1 text-xs text-amber-700">' + (r.reason || '') + ' · ' + r.abMins + ' 分钟</div>' : '') +
            (r.remark ? '<div class="mt-1 text-xs text-slate-500">备注：' + r.remark + '</div>' : '') +
          '</div>';
        });
      });

      main.innerHTML = html;
    }

    boot();
  </script>
</body>
</html>
