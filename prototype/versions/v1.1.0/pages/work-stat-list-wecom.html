<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>作业记录 · 企微H5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="../assets/work-stat-sheet-store.js"></script>
  <style>
    :root { --brand: #0f766e; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; font-size: 14px; background: #f1f5f9; }
    .btn { border-radius: 20px; -webkit-transition: all .15s ease; transition: all .15s ease; }
    .btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
    .btn-brand { background: var(--brand); color: #fff; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .badge { border-radius: 999px; font-size: 12px; padding: 2px 10px; display: inline-block; }
    .badge-draft { background: #e2e8f0; color: #475569; }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-ok { background: #d1fae5; color: #047857; }
    .badge-reject { background: #fee2e2; color: #b91c1c; }
    .toast { position: absolute; top: 72px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 90; min-width: 220px; max-width: 90%; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .page-bg { background: #e2e8f0; min-height: 100vh; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; padding: 24px 12px; box-sizing: border-box; }
    .phone-frame { width: 390px; height: 844px; border-radius: 48px; border: 3px solid #e5e7eb; background: #0f172a; box-shadow: 0 12px 40px rgba(15,23,42,0.18); padding: 12px; box-sizing: border-box; }
    .phone-screen { width: 100%; height: 100%; border-radius: 36px; background: #f1f5f9; overflow: hidden; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column; position: relative; }
    .phone-status { height: 28px; background: #fff; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; padding: 0 16px; font-size: 11px; color: #334155; border-bottom: 1px solid #f1f5f9; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .phone-scroll { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
    .wecom-tag { font-size: 10px; color: #0f766e; background: #ccfbf1; border-radius: 999px; padding: 1px 8px; }
    .nav-back { display: inline-flex; align-items: center; gap: 2px; color: #0f766e; font-size: 15px; text-decoration: none; min-width: 56px; }
    .cell-bar { background: #fff; border-radius: 12px; overflow: hidden; }
    .cell { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; min-height: 48px; }
    .cell-label { color: #64748b; font-size: 15px; }
    .cell-value { color: #0f172a; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .cell-value input[type="date"] { border: 0; background: transparent; color: #0f172a; font-size: 15px; text-align: right; outline: none; max-width: 148px; }
    .seg { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; scrollbar-width: none; }
    .seg::-webkit-scrollbar { display: none; }
    .seg-btn { flex-shrink: 0; min-height: 32px; padding: 6px 14px; border-radius: 999px; border: 1px solid #e2e8f0; background: #fff; color: #475569; font-size: 13px; }
    .seg-btn:active { transform: scale(0.95); }
    .seg-btn.on { background: #0f766e; border-color: #0f766e; color: #fff; font-weight: 600; }
    .sec-lab { font-size: 12px; color: #94a3b8; margin: 10px 2px 6px; }
    .op-link { color: #0f766e; font-size: 13px; background: none; border: none; padding: 8px 0; min-height: 44px; margin-right: 16px; }
    .op-ok { color: #047857; }
    .op-reject { color: #dc2626; }
    .mask { position: absolute; inset: 0; background: rgba(15,23,42,0.45); z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px 16px; }
    .mask.open { display: flex; }
    .sheet { width: 100%; max-width: 320px; background: #fff; border-radius: 20px; padding: 16px 16px 20px; }
  </style>
</head>
<body class="page-bg text-slate-800">
  <div class="phone-frame" aria-label="手机预览框">
    <div class="phone-screen">
      <div class="phone-status">
        <span>9:41</span>
        <span class="wecom-tag">企微 H5</span>
        <span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span>
      </div>

      <header class="sticky top-0 z-30 bg-white border-b border-slate-100 px-3 h-11 flex items-center shrink-0">
        <a href="../index.html" class="nav-back"><i class="fa-solid fa-chevron-left"></i>返回</a>
        <div class="font-semibold text-[17px] flex-1 text-center">作业记录</div>
        <span class="min-w-[56px] shrink-0" aria-hidden="true"></span>
      </header>

      <div class="phone-scroll">
        <div class="px-4 pt-3">
          <div class="cell-bar">
            <div class="cell">
              <span class="cell-label">开班日</span>
              <label class="cell-value">
                <input id="filterDate" type="date" onchange="onFilterChange()" />
                <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
              </label>
            </div>
          </div>
          <div class="flex items-center justify-between mt-3 mb-1">
            <div class="sec-lab mt-0 mb-0">班次</div>
            <button type="button" id="btnClear" class="hidden text-[13px] text-teal-700 py-1" onclick="resetFilters()">清除条件</button>
          </div>
          <div class="seg" id="shiftSeg"></div>
          <div class="sec-lab">状态</div>
          <div class="seg" id="statusSeg"></div>
        </div>

        <div class="px-4 pt-3 pb-1 text-xs text-slate-400" id="listCount">共 0 条</div>
        <main class="px-4 space-y-2.5 pb-8" id="listBody"></main>
        <div id="emptyState" class="hidden px-4 pb-16 text-center text-sm text-slate-400 pt-8">暂无符合条件的作业记录</div>
      </div>

      <div id="rejectMask" class="mask" onclick="closeIfMask(event,'rejectMask')">
        <div class="sheet" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between mb-3">
            <div class="font-semibold text-base">驳回本班</div>
            <button type="button" class="text-slate-400" onclick="closeReject()"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <p class="text-xs text-slate-500 mb-2" id="rejectHint">—</p>
          <textarea id="rejectReason" rows="3" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm" placeholder="驳回原因（选填）"></textarea>
          <div class="flex gap-2 mt-4">
            <button type="button" class="btn border border-slate-200 bg-white flex-1 py-2.5 text-sm" onclick="closeReject()">取消</button>
            <button type="button" class="btn flex-1 py-2.5 text-sm text-white" style="background:#dc2626" onclick="confirmReject()">确认驳回</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var S = WorkStatSheetStore;
    var rejectTarget = null;
    var range = S.dateRange();
    var filterShift = '';
    var filterStatus = '';
    var SHIFT_OPTS = [
      { value: '', label: '全部' },
      { value: '白班', label: '白班' },
      { value: '夜班', label: '夜班' }
    ];
    var STATUS_OPTS = [
      { value: '', label: '全部' },
      { value: '草稿', label: '草稿' },
      { value: '审批中', label: '审批中' },
      { value: '已驳回', label: '已驳回' },
      { value: '已通过', label: '已通过' }
    ];

    function paintSeg(elId, opts, current, kind) {
      document.getElementById(elId).innerHTML = opts.map(function (o) {
        var on = o.value === current ? ' on' : '';
        return '<button type="button" class="seg-btn' + on + '" data-kind="' + kind + '" data-value="' + o.value + '">' + o.label + '</button>';
      }).join('');
    }

    function paintFilters() {
      paintSeg('shiftSeg', SHIFT_OPTS, filterShift, 'shift');
      paintSeg('statusSeg', STATUS_OPTS, filterStatus, 'status');
      var dateVal = document.getElementById('filterDate').value;
      var dirty = !!(dateVal || filterShift || filterStatus);
      document.getElementById('btnClear').classList.toggle('hidden', !dirty);
    }

    function onFilterChange() {
      paintFilters();
      renderList();
    }

    function setFilter(kind, value) {
      if (kind === 'shift') filterShift = value;
      if (kind === 'status') filterStatus = value;
      onFilterChange();
    }

    function showToast(msg, type) {
      type = type || 'ok';
      var host = document.querySelector('.phone-screen');
      var el = document.createElement('div');
      el.className = 'toast px-4 py-3 text-sm text-white text-center ' + (type === 'err' ? 'bg-red-500' : type === 'warn' ? 'bg-amber-500' : 'bg-emerald-500');
      el.textContent = msg;
      host.appendChild(el);
      setTimeout(function () { el.remove(); }, 2400);
    }

    function statusClass(st) {
      if (st === '审批中') return 'badge-pending';
      if (st === '已驳回') return 'badge-reject';
      if (st === '已通过') return 'badge-ok';
      return 'badge-draft';
    }

    function resetFilters() {
      document.getElementById('filterDate').value = '';
      filterShift = '';
      filterStatus = '';
      onFilterChange();
    }

    function openFill(date, shift) {
      S.setActive({ date: date, shift: shift, unitId: '' });
      window.location.href = 'work-stat-edit-wecom.html?date=' + encodeURIComponent(date) + '&shift=' + encodeURIComponent(shift);
    }

    function doApprove(date, shift) {
      if (!confirm('确认通过本班？\n' + date + ' · ' + shift + '\n（该班次下全部机台表一并通过）')) return;
      var res = S.approveSheet(date, shift);
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      showToast('已通过 ' + date + ' ' + shift);
      renderList();
    }

    function openReject(date, shift) {
      rejectTarget = { date: date, shift: shift };
      document.getElementById('rejectHint').textContent = date + ' · ' + shift + ' · 整班驳回';
      document.getElementById('rejectReason').value = '';
      document.getElementById('rejectMask').classList.add('open');
    }

    function closeReject() {
      rejectTarget = null;
      document.getElementById('rejectMask').classList.remove('open');
    }

    function confirmReject() {
      if (!rejectTarget) return;
      var res = S.rejectSheet(rejectTarget.date, rejectTarget.shift, document.getElementById('rejectReason').value.trim());
      if (!res.ok) { showToast(res.msg, 'err'); return; }
      showToast('已驳回 ' + rejectTarget.date + ' ' + rejectTarget.shift, 'warn');
      closeReject();
      renderList();
    }

    function closeIfMask(e, id) {
      if (e.target === document.getElementById(id)) document.getElementById(id).classList.remove('open');
    }

    function renderList() {
      var date = document.getElementById('filterDate').value;
      var shift = filterShift;
      var status = filterStatus;
      var rows = S.listSheets().filter(function (s) {
        if (s.date < range.from || s.date > range.to) return false;
        if (date && s.date !== date) return false;
        if (shift && s.shift !== shift) return false;
        if (status && s.status !== status) return false;
        return true;
      });

      document.getElementById('listCount').textContent = '共 ' + rows.length + ' 条 · 近 8 天';
      var box = document.getElementById('listBody');
      var empty = document.getElementById('emptyState');
      if (!rows.length) {
        box.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      box.innerHTML = rows.map(function (s) {
        var units = (s.units || []).map(function (u) {
          var v = S.resolveVessel(u, null);
          return u.berth + '/' + u.machine + '/' + (v.name || '—');
        }).join('；') || '—';
        var st = s.status || '草稿';
        var ops = '<div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap gap-y-2">';
        if (st === '审批中') {
          ops += '<button type="button" class="op-link op-ok" onclick="doApprove(\'' + s.date + '\',\'' + s.shift + '\')">通过</button>';
          ops += '<button type="button" class="op-link op-reject" onclick="openReject(\'' + s.date + '\',\'' + s.shift + '\')">驳回</button>';
        }
        if (st === '草稿' || st === '已驳回') {
          ops += '<button type="button" class="op-link" onclick="openFill(\'' + s.date + '\',\'' + s.shift + '\')">继续填报</button>';
        } else {
          ops += '<button type="button" class="op-link" onclick="openFill(\'' + s.date + '\',\'' + s.shift + '\')">查看</button>';
        }
        ops += '</div>';
        return '<div class="card p-4">' +
          '<div class="flex items-start justify-between gap-3">' +
            '<div><div class="font-medium">' + s.date + ' · ' + s.shift + '</div>' +
            '<div class="text-xs text-slate-500 mt-1">' + (s.units ? s.units.length : 0) + ' 张机台表 · 合计 ' + S.sheetTotal(s).toFixed(2) + ' 吨</div></div>' +
            '<span class="badge ' + statusClass(st) + '">' + st + '</span>' +
          '</div>' +
          '<div class="mt-2 text-xs text-slate-500 line-clamp-2">' + units + '</div>' +
          '<div class="text-xs text-slate-400 mt-1">更新 ' + (s.updatedAt || '—') + '</div>' +
          ops +
        '</div>';
      }).join('');
    }

    (function init() {
      var dateEl = document.getElementById('filterDate');
      dateEl.min = range.from;
      dateEl.max = range.to;
      document.querySelector('.phone-scroll').addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.seg-btn') : null;
        if (!btn) return;
        setFilter(btn.getAttribute('data-kind'), btn.getAttribute('data-value') || '');
      });
      paintFilters();
      renderList();
    })();
  </script>
</body>
</html>
