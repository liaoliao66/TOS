<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>武港联投 TOS · 本地预览</title>
  <style>
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 20px;
      color: #1e293b;
      line-height: 1.65;
    }
    a { color: #0f766e; font-weight: 600; }
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      background: #f8fafc;
      margin-top: 16px;
    }
    code { font-size: 13px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
    .ok { color: #0f766e; }
    .warn { color: #b45309; }
  </style>
  <script>
    (function () {
      if (location.protocol === "http:" || location.protocol === "https:") {
        location.replace("prototype/index.html");
        return;
      }
      // file:// 下尝试探测本地服务，有则跳转
      var probe = new Image();
      var done = false;
      function go() {
        if (done) return;
        done = true;
        location.href = "http://127.0.0.1:8765/prototype/index.html";
      }
      // 用 fetch 探测（部分浏览器 file 页会拦；失败则留在本页）
      try {
        fetch("http://127.0.0.1:8765/prototype/index.html", { mode: "no-cors", cache: "no-store" })
          .then(function () { go(); })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <h1>本地预览</h1>
  <p class="warn">项目路径含中文时，Cursor / 浏览器用 <code>file://</code> 直接打开 HTML 常会报「无法访问您的文件」。请用下面方式预览。</p>
  <div class="card">
    <p><strong>推荐</strong>：双击仓库根目录 <code>打开原型预览.bat</code></p>
    <p>或在 Cursor：终端运行任务 <code>本地预览原型</code>（Terminal → Run Task）</p>
    <p>服务起来后打开：<br>
      <a href="http://127.0.0.1:8765/prototype/index.html">http://127.0.0.1:8765/prototype/index.html</a>
    </p>
    <p class="ok" style="margin-bottom:0;font-size:14px;">首次需先运行 bat；之后可收藏上述 http 链接。</p>
  </div>
</body>
</html>
